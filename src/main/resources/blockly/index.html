<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FTC Blocks</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    #blocklyDiv { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <div id="blocklyDiv"></div>

  <xml id="toolbox" style="display:none">
    <category name="Logic" colour="210">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
    </category>
    <category name="Loops" colour="120">
      <block type="controls_whileUntil"></block>
      <block type="controls_for">
        <field name="VAR">i</field>
        <value name="FROM"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
        <value name="TO"><shadow type="math_number"><field name="NUM">10</field></shadow></value>
        <value name="BY"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
      </block>
    </category>
    <category name="Math" colour="230">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
      <block type="math_single"></block>
      <block type="math_minmax"></block>
      <block type="math_modulo"></block>
      <block type="math_constant_pi"></block>
      <block type="math_random"></block>
    </category>
    <category name="Text" colour="160">
      <block type="text"></block>
      <block type="text_join2"></block>
    </category>
    <category name="Flow" colour="120">
      <block type="controls_flow_statements"></block>
    </category>
    <category name="Variables" colour="330" custom="VARIABLE"></category>
    <category name="FTC: Gamepad" colour="20">
      <block type="ftc_gamepad_button"></block>
      <block type="ftc_gamepad_axis"></block>
    </category>
    <category name="FTC: Motor" colour="60">
      <block type="ftc_motor_setpower"></block>
      <block type="ftc_motor_setmode"></block>
      <block type="ftc_motor_setdirection"></block>
      <block type="ftc_motor_setzeropower"></block>
      <block type="ftc_motor_settarget">
        <value name="POS"><shadow type="math_number"><field name="NUM">1000</field></shadow></value>
      </block>
      <block type="ftc_motor_getposition"></block>
      <block type="ftc_motor_isbusy"></block>
    </category>
    <category name="FTC: Servo" colour="80">
      <block type="ftc_servo_setposition"></block>
      <block type="ftc_crservo_setpower"></block>
    </category>
    <category name="FTC: IMU" colour="200">
      <block type="ftc_imu_yaw"></block>
      <block type="ftc_imu_resetyaw"></block>
    </category>
    <category name="FTC: Sensors" colour="200">
      <block type="ftc_color_channel"></block>
      <block type="ftc_distance_cm"></block>
      <block type="ftc_touch_pressed"></block>
    </category>
    <category name="FTC: Timing" colour="200">
      <block type="ftc_sleep">
        <value name="MS"><shadow type="math_number"><field name="NUM">500</field></shadow></value>
      </block>
      <block type="ftc_timer_new"></block>
      <block type="ftc_timer_reset"></block>
      <block type="ftc_timer_seconds"></block>
    </category>
    <category name="FTC: Telemetry" colour="290">
      <block type="ftc_telemetry_adddata"></block>
      <block type="ftc_telemetry_update"></block>
    </category>
    <category name="FTC: LinearOpMode" colour="0">
      <block type="ftc_opmode_waitforstart"></block>
      <block type="ftc_opmode_opmodeisactive"></block>
    </category>
  </xml>

  <script src="ftc_blocks.js"></script>
  <script src="ftc_generator.js"></script>
  <script>
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      trashcan: true,
      zoom: { controls: true, wheel: true }
    });

    // Java side calls these:
    window.loadXml = function(xmlText) {
      try {
        workspace.clear();
        const dom = Blockly.utils.xml.textToDom(xmlText);
        Blockly.Xml.domToWorkspace(dom, workspace);
        return "";
      } catch (e) { return "ERR: " + e.message; }
    };
    window.getXml = function() {
      const dom = Blockly.Xml.workspaceToDom(workspace);
      return Blockly.Xml.domToText(dom);
    };
    window.getJava = function() {
      return javaGenerator.workspaceToCode(workspace);
    };
  </script>
</body>
</html>
