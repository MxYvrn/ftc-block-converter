<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FTC Blocks → Java</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }
    #bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: #2b3a4a; color: #fff; flex: 0 0 auto;
    }
    #bar input {
      font: inherit; padding: 4px 6px; border: 1px solid #4a5b6c;
      border-radius: 4px;
    }
    #bar button {
      font: inherit; padding: 5px 12px; border: 0; border-radius: 4px;
      background: #4c8dff; color: #fff; cursor: pointer;
    }
    #bar button:hover { background: #3a7af0; }
    #status { margin-left: auto; opacity: 0.85; font-size: 13px; }
    #main { flex: 1 1 auto; display: flex; min-height: 0; }
    #blocklyDiv { flex: 1 1 auto; height: 100%; }
    #out {
      flex: 0 0 460px; display: flex; flex-direction: column;
      border-left: 1px solid #ccc; min-width: 0;
    }
    #out h2 {
      margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 600;
      background: #f0f2f5; border-bottom: 1px solid #ddd;
    }
    #java {
      flex: 1 1 auto; margin: 0; padding: 12px; border: 0; resize: none;
      font-family: 'Menlo', 'Consolas', monospace; font-size: 12px;
      white-space: pre; overflow: auto; background: #1e1e1e; color: #d4d4d4;
    }
  </style>
</head>
<body>
  <div id="bar">
    <label for="cls">Class:</label>
    <input id="cls" value="MyTeleOp" size="16">
    <button id="gen">Generate Java →</button>
    <button id="copy">Copy</button>
    <span id="status">Loading Blockly…</span>
  </div>

  <div id="main">
    <div id="blocklyDiv"></div>
    <div id="out">
      <h2>Generated FTC Java (paste into your TeamCode project)</h2>
      <textarea id="java" readonly spellcheck="false"
        placeholder="Drag blocks on the left, then click “Generate Java →”."></textarea>
    </div>
  </div>

  <xml id="toolbox" style="display:none">
    <category name="Logic" colour="210">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
    </category>
    <category name="Loops" colour="120">
      <block type="controls_whileUntil"></block>
      <block type="controls_for">
        <field name="VAR">i</field>
        <value name="FROM"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
        <value name="TO"><shadow type="math_number"><field name="NUM">10</field></shadow></value>
        <value name="BY"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
      </block>
    </category>
    <category name="Math" colour="230">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
      <block type="math_single"></block>
      <block type="math_minmax"></block>
      <block type="math_modulo"></block>
      <block type="math_constant_pi"></block>
      <block type="math_random"></block>
    </category>
    <category name="Text" colour="160">
      <block type="text"></block>
      <block type="text_join2"></block>
    </category>
    <category name="Flow" colour="120">
      <block type="controls_flow_statements"></block>
    </category>
    <category name="Variables" colour="330" custom="VARIABLE"></category>
    <category name="FTC: Gamepad" colour="20">
      <block type="ftc_gamepad_button"></block>
      <block type="ftc_gamepad_axis"></block>
    </category>
    <category name="FTC: Motor" colour="60">
      <block type="ftc_motor_setpower"></block>
      <block type="ftc_motor_setmode"></block>
      <block type="ftc_motor_setdirection"></block>
      <block type="ftc_motor_setzeropower"></block>
      <block type="ftc_motor_settarget">
        <value name="POS"><shadow type="math_number"><field name="NUM">1000</field></shadow></value>
      </block>
      <block type="ftc_motor_getposition"></block>
      <block type="ftc_motor_isbusy"></block>
    </category>
    <category name="FTC: Servo" colour="80">
      <block type="ftc_servo_setposition"></block>
      <block type="ftc_crservo_setpower"></block>
    </category>
    <category name="FTC: IMU" colour="200">
      <block type="ftc_imu_yaw"></block>
      <block type="ftc_imu_resetyaw"></block>
    </category>
    <category name="FTC: Sensors" colour="200">
      <block type="ftc_color_channel"></block>
      <block type="ftc_distance_cm"></block>
      <block type="ftc_touch_pressed"></block>
    </category>
    <category name="FTC: Timing" colour="200">
      <block type="ftc_sleep">
        <value name="MS"><shadow type="math_number"><field name="NUM">500</field></shadow></value>
      </block>
      <block type="ftc_timer_new"></block>
      <block type="ftc_timer_reset"></block>
      <block type="ftc_timer_seconds"></block>
    </category>
    <category name="FTC: Telemetry" colour="290">
      <block type="ftc_telemetry_adddata"></block>
      <block type="ftc_telemetry_update"></block>
    </category>
    <category name="FTC: LinearOpMode" colour="0">
      <block type="ftc_opmode_waitforstart"></block>
      <block type="ftc_opmode_opmodeisactive"></block>
    </category>
  </xml>

  <script>
  // ===== Custom FTC block definitions (core subset). =====

    {

      args0: [
        { type: "field_input", name: "NAME", text: "leftDrive" },
        { type: "field_dropdown", name: "MODE", options: [
          ["RUN_USING_ENCODER","RUN_USING_ENCODER"],

      ],

    // --- CRServo ---

        { type: "field_input", name: "NAME", text: "intake" },
        { type: "input_value", name: "POWER", check: "Number" }
      ],
      previousStatement: null, nextStatement: null, colour: 80
    },

    // --- IMU ---
    {

      ],

    },
    {
      type: "controls_flow_statements",
      message0: "%1",

                options: [["break","BREAK"],["continue","CONTINUE"]] }],

  <script>
  // ===== Minimal Java code generator for the core subset. =====
  const javaGenerator = new Blockly.Generator('Java');
  const Order = { ATOMIC: 0, NONE: 99 };
  javaGenerator.ORDER_ATOMIC = Order.ATOMIC;

  javaGenerator.scrub_ = function(block, code, thisOnly) {
    const next = block.nextConnection && block.nextConnection.targetBlock();
    const nextCode = (!thisOnly && next) ? javaGenerator.blockToCode(next) : '';
    return code + nextCode;
  };

  // --- Built-in blocks ---
  javaGenerator.forBlock['math_number'] = b => [String(b.getFieldValue('NUM')), Order.ATOMIC];
  javaGenerator.forBlock['text'] = b => [JSON.stringify(b.getFieldValue('TEXT') || ''), Order.ATOMIC];
  javaGenerator.forBlock['logic_boolean'] = b => [b.getFieldValue('BOOL') === 'TRUE' ? 'true' : 'false', Order.ATOMIC];
  javaGenerator.forBlock['logic_negate'] = b => {
    const v = javaGenerator.valueToCode(b, 'BOOL', Order.NONE) || 'false';
    return ['!(' + v + ')', Order.ATOMIC];
  };
  javaGenerator.forBlock['logic_compare'] = b => {
    const ops = { EQ:'==', NEQ:'!=', LT:'<', LTE:'<=', GT:'>', GTE:'>=' };
    const a = javaGenerator.valueToCode(b, 'A', Order.NONE) || '0';
    const c = javaGenerator.valueToCode(b, 'B', Order.NONE) || '0';
    return ['(' + a + ' ' + ops[b.getFieldValue('OP')] + ' ' + c + ')', Order.ATOMIC];
  };
  javaGenerator.forBlock['logic_operation'] = b => {
    const op = b.getFieldValue('OP') === 'AND' ? '&&' : '||';
    const a = javaGenerator.valueToCode(b, 'A', Order.NONE) || 'false';
    const c = javaGenerator.valueToCode(b, 'B', Order.NONE) || 'false';
    return ['(' + a + ' ' + op + ' ' + c + ')', Order.ATOMIC];
  };
  javaGenerator.forBlock['math_arithmetic'] = b => {
    const ops = { ADD:'+', MINUS:'-', MULTIPLY:'*', DIVIDE:'/' };
    const a = javaGenerator.valueToCode(b, 'A', Order.NONE) || '0';
    const c = javaGenerator.valueToCode(b, 'B', Order.NONE) || '0';
    const op = ops[b.getFieldValue('OP')] || '+';
    if (op) return ['(' + a + ' ' + op + ' ' + c + ')', Order.ATOMIC];
    return ['Math.pow(' + a + ', ' + c + ')', Order.ATOMIC];
  };
  javaGenerator.forBlock['controls_if'] = b => {
    let n = 0, code = '';
    do {
      const cond = javaGenerator.valueToCode(b, 'IF' + n, Order.NONE) || 'false';
      const body = javaGenerator.statementToCode(b, 'DO' + n);
      code += (n === 0 ? 'if (' : 'else if (') + cond + ') {\n' + body + '}\n';
      n++;
    } while (b.getInput('IF' + n));
    if (b.getInput('ELSE')) code += 'else {\n' + javaGenerator.statementToCode(b, 'ELSE') + '}\n';
    return code;
  };
  javaGenerator.forBlock['controls_whileUntil'] = b => {
    let cond = javaGenerator.valueToCode(b, 'BOOL', Order.NONE) || 'false';
    if (b.getFieldValue('MODE') === 'UNTIL') cond = '!(' + cond + ')';
    return 'while (' + cond + ') {\n' + javaGenerator.statementToCode(b, 'DO') + '}\n';
  };
  javaGenerator.forBlock['controls_for'] = b => {
    const v = b.getFieldValue('VAR');
    const from = javaGenerator.valueToCode(b, 'FROM', Order.NONE) || '0';
    const to   = javaGenerator.valueToCode(b, 'TO',   Order.NONE) || '0';
    const by   = javaGenerator.valueToCode(b, 'BY',   Order.NONE) || '1';
    return 'for (int ' + v + ' = ' + from + '; ' + v + ' <= ' + to + '; ' + v + ' += ' + by + ') {\n'
         + javaGenerator.statementToCode(b, 'DO') + '}\n';
  };
  javaGenerator.forBlock['variables_get'] = b => [b.getField('VAR').getText(), Order.ATOMIC];
  javaGenerator.forBlock['variables_set'] = b => {
    const name = b.getField('VAR').getText();
    const val = javaGenerator.valueToCode(b, 'VALUE', Order.NONE) || '0';
    return name + ' = ' + val + ';\n';
  };

  // --- FTC blocks ---
  javaGenerator.forBlock['ftc_gamepad_button'] =
    b => [b.getFieldValue('PAD') + '.' + b.getFieldValue('BTN'), Order.ATOMIC];
  javaGenerator.forBlock['ftc_gamepad_axis'] =
    b => [b.getFieldValue('PAD') + '.' + b.getFieldValue('AXIS'), Order.ATOMIC];
  javaGenerator.forBlock['ftc_motor_setpower'] = b => {
    const name = b.getFieldValue('NAME');
    const pow = javaGenerator.valueToCode(b, 'POWER', Order.NONE) || '0';
    return name + '.setPower(' + pow + ');\n';
  };
  javaGenerator.forBlock['ftc_servo_setposition'] = b => {
    const name = b.getFieldValue('NAME');
    const pos = javaGenerator.valueToCode(b, 'POS', Order.NONE) || '0';
    return name + '.setPosition(' + pos + ');\n';
  };
  javaGenerator.forBlock['ftc_telemetry_adddata'] = b => {
    const cap = javaGenerator.valueToCode(b, 'CAPTION', Order.NONE) || '""';
    const val = javaGenerator.valueToCode(b, 'VALUE', Order.NONE) || '""';
    return 'telemetry.addData(' + cap + ', ' + val + ');\n';
  };
  javaGenerator.forBlock['ftc_telemetry_update']     = () => 'telemetry.update();\n';
  javaGenerator.forBlock['ftc_opmode_waitforstart']  = () => 'waitForStart();\n';
  javaGenerator.forBlock['ftc_opmode_opmodeisactive']= () => ['opModeIsActive()', Order.ATOMIC];

  // --- Motor extras ---
  javaGenerator.forBlock['ftc_motor_setmode'] = b =>
    b.getFieldValue('NAME') + '.setMode(DcMotor.RunMode.' + b.getFieldValue('MODE') + ');\n';
  javaGenerator.forBlock['ftc_motor_setdirection'] = b =>
    b.getFieldValue('NAME') + '.setDirection(DcMotorSimple.Direction.' + b.getFieldValue('DIR') + ');\n';
  javaGenerator.forBlock['ftc_motor_setzeropower'] = b =>
    b.getFieldValue('NAME') + '.setZeroPowerBehavior(DcMotor.ZeroPowerBehavior.' + b.getFieldValue('BEH') + ');\n';
  javaGenerator.forBlock['ftc_motor_settarget'] = b => {
    const v = javaGenerator.valueToCode(b, 'POS', Order.NONE) || '0';
    return b.getFieldValue('NAME') + '.setTargetPosition((int)(' + v + '));\n';
  };
  javaGenerator.forBlock['ftc_motor_getposition'] =
    b => [b.getFieldValue('NAME') + '.getCurrentPosition()', Order.ATOMIC];
  javaGenerator.forBlock['ftc_motor_isbusy'] =
    b => [b.getFieldValue('NAME') + '.isBusy()', Order.ATOMIC];

  // --- CRServo ---
  javaGenerator.forBlock['ftc_crservo_setpower'] = b => {
    const v = javaGenerator.valueToCode(b, 'POWER', Order.NONE) || '0';
    return b.getFieldValue('NAME') + '.setPower(' + v + ');\n';
  };

  // --- IMU ---
  javaGenerator.forBlock['ftc_imu_yaw'] = b => [
    b.getFieldValue('NAME') + '.getRobotYawPitchRollAngles().getYaw(AngleUnit.DEGREES)',
    Order.ATOMIC
  ];
  javaGenerator.forBlock['ftc_imu_resetyaw'] = b => b.getFieldValue('NAME') + '.resetYaw();\n';

  // --- Sensors ---
  javaGenerator.forBlock['ftc_color_channel'] =
    b => [b.getFieldValue('NAME') + '.' + b.getFieldValue('CH') + '()', Order.ATOMIC];
  javaGenerator.forBlock['ftc_distance_cm'] =
    b => [b.getFieldValue('NAME') + '.getDistance(DistanceUnit.CM)', Order.ATOMIC];
  javaGenerator.forBlock['ftc_touch_pressed'] =
    b => [b.getFieldValue('NAME') + '.isPressed()', Order.ATOMIC];

  // --- Utility ---
  javaGenerator.forBlock['ftc_sleep'] = b => {
    const v = javaGenerator.valueToCode(b, 'MS', Order.NONE) || '0';
    return 'sleep((long)(' + v + '));\n';
  };
  javaGenerator.forBlock['ftc_timer_new'] = () => ['new ElapsedTime()', Order.ATOMIC];
  javaGenerator.forBlock['ftc_timer_reset'] = b => b.getFieldValue('NAME') + '.reset();\n';
  javaGenerator.forBlock['ftc_timer_seconds'] =
    b => [b.getFieldValue('NAME') + '.seconds()', Order.ATOMIC];

  javaGenerator.forBlock['math_single'] = b => {
    const v = javaGenerator.valueToCode(b, 'NUM', Order.NONE) || '0';
    const op = b.getFieldValue('OP');
    const map = {
      ABS:'Math.abs(' + v + ')',
      ROOT:'Math.sqrt(' + v + ')',
      NEG:'(-(' + v + '))',
      SIN:'Math.sin(Math.toRadians(' + v + '))',
      COS:'Math.cos(Math.toRadians(' + v + '))',
      TAN:'Math.tan(Math.toRadians(' + v + '))'
    };
    return [map[op], Order.ATOMIC];
  };
  javaGenerator.forBlock['math_minmax'] = b => {
    const a = javaGenerator.valueToCode(b, 'A', Order.NONE) || '0';
    const c = javaGenerator.valueToCode(b, 'B', Order.NONE) || '0';
    return ['Math.' + b.getFieldValue('OP').toLowerCase() + '(' + a + ', ' + c + ')', Order.ATOMIC];
  };
  javaGenerator.forBlock['math_modulo'] = b => {
    const a = javaGenerator.valueToCode(b, 'A', Order.NONE) || '0';
    const c = javaGenerator.valueToCode(b, 'B', Order.NONE) || '1';
    return ['(' + a + ' % ' + c + ')', Order.ATOMIC];
  };
  javaGenerator.forBlock['math_constant_pi'] = () => ['Math.PI', Order.ATOMIC];
  javaGenerator.forBlock['math_random'] = () => ['Math.random()', Order.ATOMIC];
  javaGenerator.forBlock['text_join2'] = b => {
    const a = javaGenerator.valueToCode(b, 'A', Order.NONE) || '""';
    const c = javaGenerator.valueToCode(b, 'B', Order.NONE) || '""';
    return ['(' + a + ' + ' + c + ')', Order.ATOMIC];
  };
  javaGenerator.forBlock['controls_flow_statements'] =
    b => (b.getFieldValue('FLOW') === 'BREAK' ? 'break;\n' : 'continue;\n');
  </script>

  <script>
  // ===== Wraps generated body in a valid LinearOpMode class (port of OpModeWrapper). =====
  function wrapOpMode(className, body) {
    const collect = (re) => {
      const out = [], seen = new Set();
      const r = new RegExp(re.source, 'g');
      let m;
      while ((m = r.exec(body)) !== null) {
        if (!seen.has(m[1])) { seen.add(m[1]); out.push(m[1]); }
      }
      return out;
    };

    const MOTOR_HINTS = /\b([A-Za-z_][A-Za-z_0-9]*)\.(setMode|setTargetPosition|getCurrentPosition|isBusy|setZeroPowerBehavior|setDirection)\b/;
    const MOTOR_SETPOWER = /\b([A-Za-z_][A-Za-z_0-9]*)\.setPower\b/;
    const SERVO = /\b([A-Za-z_][A-Za-z_0-9]*)\.setPosition\b/;
    const IMU = /\b([A-Za-z_][A-Za-z_0-9]*)\.(resetYaw|getRobotYawPitchRollAngles)\b/;
    const DIST = /\b([A-Za-z_][A-Za-z_0-9]*)\.getDistance\b/;
    const TOUCH = /\b([A-Za-z_][A-Za-z_0-9]*)\.isPressed\b/;
    const COLOR = /\b([A-Za-z_][A-Za-z_0-9]*)\.(red|green|blue|alpha)\(\)/;
    const TIMER = /\b([A-Za-z_][A-Za-z_0-9]*)\s*=\s*new\s+ElapsedTime/;

    const motors = collect(MOTOR_HINTS);
    for (const n of collect(MOTOR_SETPOWER)) if (!motors.includes(n)) motors.push(n);
    const servos  = collect(SERVO).filter(n => !motors.includes(n));
    const imus    = collect(IMU);
    const dists   = collect(DIST);
    const touches = collect(TOUCH);
    const colors  = collect(COLOR);
    const timers  = collect(TIMER);

    let s = '';
    s += 'package org.firstinspires.ftc.teamcode;\n\n';
    s += 'import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;\n';
    s += 'import com.qualcomm.robotcore.eventloop.opmode.TeleOp;\n';
    s += 'import com.qualcomm.robotcore.hardware.DcMotor;\n';
    s += 'import com.qualcomm.robotcore.hardware.DcMotorSimple;\n';
    s += 'import com.qualcomm.robotcore.hardware.Servo;\n';
    if (imus.length)    s += 'import com.qualcomm.robotcore.hardware.IMU;\n';
    if (dists.length)   s += 'import com.qualcomm.robotcore.hardware.DistanceSensor;\n';
    if (touches.length) s += 'import com.qualcomm.robotcore.hardware.TouchSensor;\n';
    if (colors.length)  s += 'import com.qualcomm.robotcore.hardware.ColorSensor;\n';
    if (timers.length)  s += 'import com.qualcomm.robotcore.util.ElapsedTime;\n';
    if (imus.length)    s += 'import org.firstinspires.ftc.robotcore.external.navigation.AngleUnit;\n';
    if (dists.length)   s += 'import org.firstinspires.ftc.robotcore.external.navigation.DistanceUnit;\n';
    s += '\n@TeleOp(name="' + className + '")\n';
    s += 'public class ' + className + ' extends LinearOpMode {\n';
    s += '    @Override public void runOpMode() {\n';

    const declare = (type, names) => {
      for (const n of names)
        s += '        ' + type + ' ' + n + ' = hardwareMap.get(' + type + '.class, "' + n + '");\n';
    };
    declare('DcMotor', motors);
    declare('Servo', servos);
    declare('IMU', imus);
    declare('DistanceSensor', dists);
    declare('TouchSensor', touches);
    declare('ColorSensor', colors);
    s += '\n';

    // Java's String.split("\n") drops trailing empty lines; mirror that.
    const lines = body.split('\n');
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    for (const line of lines) s += '        ' + line + '\n';
    s += '    }\n}\n';
    return s;
  }
  </script>

  <script>
  // ===== App wiring =====
  const workspace = Blockly.inject('blocklyDiv', {
    toolbox: document.getElementById('toolbox'),
    trashcan: true,
    zoom: { controls: true, wheel: true }
  });

  const statusEl = document.getElementById('status');
  const javaEl   = document.getElementById('java');
  const clsEl    = document.getElementById('cls');

  statusEl.textContent = 'Ready.';

  function generate() {
    try {
      const body = javaGenerator.workspaceToCode(workspace);
      const cls = clsEl.value.trim() || 'MyTeleOp';
      javaEl.value = wrapOpMode(cls, body);
      statusEl.textContent = 'Java generated.';
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message;
    }
  }

  document.getElementById('gen').addEventListener('click', generate);

  document.getElementById('copy').addEventListener('click', async () => {
    if (!javaEl.value) { statusEl.textContent = 'Nothing to copy yet.'; return; }
    try {
      await navigator.clipboard.writeText(javaEl.value);
      statusEl.textContent = 'Copied to clipboard.';
    } catch (e) {
      javaEl.focus(); javaEl.select();
      statusEl.textContent = 'Press Ctrl/Cmd+C to copy.';
    }
  });

  // Regenerate as you build, once something has been generated once.
  workspace.addChangeListener(() => {
    if (javaEl.value) generate();
  });
  </script>
</body>
